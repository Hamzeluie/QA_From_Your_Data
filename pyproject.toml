[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "neo4j: marks tests that require a running Neo4j instance",
    "postgres: marks tests that require PostgreSQL",
    "qdrant: marks tests that require a running Qdrant instance",
    "elasticsearch: marks tests that require a running Elasticsearch instance",
    "redis: marks tests that require a running Redis instance",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
pythonpath = ["."]