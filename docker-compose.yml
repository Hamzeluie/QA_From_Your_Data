services:
  neo4j:
    image: neo4j:5
    container_name: kg_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=none
    volumes:
      - ${DB_DATA_DIR}/neo4j/data:/data
      - ${DB_DATA_DIR}/neo4j/logs:/logs
    networks:
      - kg_network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: kg_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ${DB_DATA_DIR}/qdrant:/qdrant/storage
    networks:
      - kg_network

  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: kg_elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - ${DB_DATA_DIR}/elasticsearch:/usr/share/elasticsearch/data
    networks:
      - kg_network

  clickhouse:
    image: clickhouse/clickhouse-server:21.3
    container_name: kg_clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ${DB_DATA_DIR}/clickhouse:/var/lib/clickhouse
    networks:
      - kg_network

  redis:
    image: redis:7-alpine
    container_name: kg_redis
    ports:
      - "6379:6379"
    volumes:
      - ${DB_DATA_DIR}/redis:/data
    command: redis-server --appendonly yes
    networks:
      - kg_network

networks:
  kg_network:
    driver: bridge
